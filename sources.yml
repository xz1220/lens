# lens source map — 31 sources, the distilled + live-verified output of the
# daily-intel research. Human-readable version + provenance: docs/SOURCES.md.
#
# Field guide
#   tier     : P0 (machine-first primary) | P1 (expert-owned) | P2 (ranking/fill) | heat (discovery candidates)
#   method   : rss | atom | json | html
#   adapter  : collect.py handler that ingests this source. null = NOT yet wired
#              (the source is real, the ingestion just isn't built — good first tasks).
#   status   : ok           – verified to return data with a plain GET
#              needs_parse  – returns 200 but data is in embedded JSON / HTML, needs scraping
#              needs_headless – page is JS-only, needs a real browser
#              needs_token  – requires an API token / OAuth
#              blocked      – currently un-fetchable (OAuth wall / bot block); degraded, not chased
#   ua       : optional override User-Agent (SEC requires a descriptive one)

