name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps (PyYAML only — 项目铁律：零额外依赖)
        run: pip install pyyaml
      - name: Run tests (zero-network, fixture-driven)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Privacy gate — data/ 必须为空（工具开源，思考私有）
        run: |
          if [ -n "$(git ls-files data)" ]; then
            echo "::error::data/ 下有文件被 git 跟踪 —— 私人数据不得进公开仓库"
            git ls-files data
            exit 1
          fi
