    ua: "lens-intake research <set-your-contact@example.com>"
    notes: 用 EDGAR 全文检索后端 efts.sec.gov/LATEST/search-index（非 submissions 全量）。查询=短语 "artificial intelligence" + forms=8-K,S-1,424B，定向捞「提到 AI 的新 filing」（sec-latest-filings 已覆盖全量噪声）。adapter 追加滚动近 90 天 startdt/enddt，重跑只增新条。需合规 UA（src.ua，403 否则）——别动占位 email，留给用户填。

