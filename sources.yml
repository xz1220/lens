    ua: "lens-intake research <set-your-contact@example.com>"
    digest: false
    notes: 文档曾记 403——其实只要带合规 UA 即通，实测 40 条 entry。Form D 同理。全量申报流水（多为 Form 4 持股变动），信息密度太低，不值得花 LLM 总结（已标 digest=false）；定向 AI filing 看 sec-edgar-api。

